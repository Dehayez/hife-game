              <feDisplacementMap in="SourceGraphic" scale="1.4" />
            </filter>
          </defs>
          <g class="loading-screen__crest-strokes" filter="url(#ls-chalk)">

            <!-- TRIDENT: three prongs at top-left, long shaft to bottom-right pommel -->
            <g class="loading-screen__crest-mace">
              <!-- Long shaft (top-left → bottom-right) -->
              <path d="M 122 96 Q 180 188 244 286" />
              <!-- Center prong (tallest, with a small curl/flag at tip) -->
              <path d="M 122 96 L 116 36" />
              <path d="M 116 36 C 124 30, 130 36, 126 44 C 122 50, 116 48, 116 44" />
              <!-- Left prong (curving up and out) -->
              <path d="M 122 96 C 100 86, 84 64, 76 44" />
              <path d="M 76 44 L 70 56 M 76 44 L 86 48" />
              <!-- Right prong (mirror of left) -->
              <path d="M 122 96 C 142 82, 158 64, 168 46" />
              <path d="M 168 46 L 162 58 M 168 46 L 158 48" />
              <!-- Ferrule: small band where prongs meet shaft -->
              <path d="M 110 100 Q 122 92 134 100" />
              <line x1="114" y1="106" x2="132" y2="98" />
              <!-- Pommel ball at the bottom-right -->
              <circle cx="246" cy="290" r="7" />
            </g>

            <!-- CRYSTAL SWORD: big faceted gem-blade, tip top-right → grip bottom-left -->
            <g class="loading-screen__crest-sword">
              <!-- Outer blade silhouette: long faceted crystal -->
              <path d="M 286 38
                       L 296 86
                       L 282 140
                       L 256 188
                       L 232 218
                       L 214 222
                       L 206 198
                       L 218 152
                       L 240 100
                       L 266 60
                       Z" />
              <!-- Internal crystal facets — a few sharp straight cuts -->
              <!-- Central spine running tip → grip -->
              <path d="M 286 38 L 220 220" />
              <!-- Right-side facet line -->
              <path d="M 296 86 L 232 218" />
              <!-- Left-side facet line -->
              <path d="M 266 60 L 214 222" />
              <!-- Grip: blade base flows into a thin shaft -->
              <path d="M 218 222 Q 178 264 128 304" />
              <path d="M 232 220 Q 192 262 142 302" />
              <!-- Tiny grip-wrap rings -->

              <line x1="170" y1="264" x2="180" y2="258" />
              <!-- Pommel ball at the bottom-left -->

            </g>

    <script>
      // Rotating splash tagline — swaps every few seconds with a soft fade.
      // Stops as soon as the loading screen is dismissed.
      (function () {
        var el = document.getElementById('loading-status-text');
        var screen = document.getElementById('loading-screen');
        if (!el || !screen) return;

        var lines = [
          "Lay within' crowd to run in peace",
          "Stand the high ground, let the low folk fall",
          "Where the mushroom-folk wake the old magic",
          "Sharper than steel: a friend at your back",
          "The grove remembers — so do the Mools",
          "Step softly. Strike sudden."
        ];
        var ROTATE_MS = 5000;
        var FADE_MS = 320;
        var i = Math.floor(Math.random() * lines.length);
        el.textContent = lines[i];

        var timer = setInterval(function () {
          if (screen.classList.contains('is-hidden')) {
            clearInterval(timer);
            return;
          }
          i = (i + 1) % lines.length;
          el.style.transition = 'opacity ' + FADE_MS + 'ms ease';
          el.style.opacity = '0';
          setTimeout(function () {
            el.textContent = lines[i];
            el.style.opacity = '';
          }, FADE_MS);
        }, ROTATE_MS);
      })();
    </script>
